<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部室BGM</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #now-playing {
            margin: 20px 0;
        }

        /*
         * 曲一覧を四角い枠の中でスクロール
         */
        #song-list {
            height: 300px;
            overflow-y: auto;

            border: 1px solid #aaa;
            border-radius: 6px;

            padding: 5px;
        }

        .song {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .song:last-child {
            border-bottom: none;
        }

        .song:hover {
            background: #f5f5f5;
        }

        #status {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

<h1>部室BGM</h1>

<p>
    再生ボタンを押すだけで、部室のBGMを流すシンプルな音楽プレイヤー
</p>


<section>
    <h2>再生中</h2>

    <div id="now-playing">
        まだ再生していません
    </div>

    <audio id="audio" controls></audio>

    <div>
        <button id="like-button">
            👍 高評価
        </button>

        <button id="dislike-button">
            👎 低評価
        </button>

        <button id="skip-button">
            ⏭ スキップ
        </button>

        <button id="not-song-button">
            🚫 曲ではない
        </button>
    </div>

    <div id="status"></div>
</section>


<section>
    <h2>曲一覧</h2>

    <div id="song-list">
        曲を読み込んでいます…
    </div>
</section>


<section>
    <h2>再生履歴</h2>

    <button id="export-button">
        play_history.json を保存
    </button>

    <button id="clear-button">
        ローカル履歴を削除
    </button>

    <p>
        保存件数:
        <span id="history-count">0</span>
    </p>
</section>


<script>
"use strict";


/*
 * ========================================
 * データ
 * ========================================
 */

let songs = [];

let currentSong = null;

let playbackStartedAt = null;

let liked = "none";

let skipped = false;


/*
 * 学習対象外にした曲のID一覧
 *
 * 例:
 * [123, 456, 789]
 */
let notSongIds = getNotSongIds();


/*
 * 1ページを1セッションとして扱う
 *
 * 例:
 * 20260910-103012-a1b2c3d4
 */
const sessionId = createSessionId();


/*
 * ========================================
 * session_id
 * ========================================
 */

function createSessionId() {

    const now = new Date();

    const timestamp =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        "-" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");


    const random =
        crypto.randomUUID
            ? crypto.randomUUID().split("-")[0]
            : Math.random().toString(16).slice(2, 10);


    return `${timestamp}-${random}`;
}


/*
 * ========================================
 * not_song
 * ========================================
 */

/*
 * localStorageから
 * 学習対象外の曲ID一覧を取得
 */
function getNotSongIds() {

    const data =
        localStorage.getItem("not_song_ids");


    if (!data) {
        return [];
    }


    try {

        return JSON.parse(data);

    } catch (error) {

        console.error(error);

        return [];
    }
}


/*
 * 学習対象外の曲ID一覧を保存
 */
function saveNotSongIds() {

    localStorage.setItem(
        "not_song_ids",
        JSON.stringify(notSongIds)
    );
}


/*
 * 曲が学習対象外かどうか
 */
function isNotSong(songId) {

    return notSongIds.includes(songId);
}


/*
 * 「曲ではない」ボタンの表示を更新
 */
function updateNotSongButton() {

    const button =
        document.getElementById("not-song-button");


    if (currentSong === null) {

        button.textContent =
            "🚫 曲ではない";

        return;
    }


    if (isNotSong(currentSong.id)) {

        button.textContent =
            "✅ 曲として扱う";

    } else {

        button.textContent =
            "🚫 曲ではない";
    }
}


/*
 * ========================================
 * songs.json 読み込み
 * ========================================
 */

async function loadSongs() {

    try {

        const response =
            await fetch("songs.json");


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }


        songs =
            await response.json();


        renderSongList();

    } catch (error) {

        console.error(error);


        document.getElementById("song-list")
            .textContent =
            "曲の読み込みに失敗しました。";
    }
}


/*
 * ========================================
 * 曲一覧
 * ========================================
 */

function renderSongList() {

    const list =
        document.getElementById("song-list");


    list.innerHTML = "";


    for (const song of songs) {

        const element =
            document.createElement("div");


        element.className =
            "song";


        element.textContent =
            `${song.name} - ${song.username}`;


        element.addEventListener(
            "click",
            () => {
                playSong(song);
            }
        );


        list.appendChild(element);
    }
}


/*
 * ========================================
 * 曲再生
 * ========================================
 */

function playSong(song) {

    /*
     * すでに曲が再生中の場合、
     * 現在の曲のログを確定する。
     */
    if (currentSong !== null) {

        finishPlayback();
    }


    currentSong = song;

    liked = "none";

    skipped = false;

    playbackStartedAt =
        new Date();


    const audio =
        document.getElementById("audio");


    /*
     * 現在の再生を停止
     */
    audio.pause();


    /*
     * 曲を変更
     */
    audio.src =
        song.preview_url;


    /*
     * 再生位置を先頭へ
     */
    audio.currentTime = 0;


    /*
     * 表示更新
     */
    document.getElementById("now-playing")
        .textContent =
        `${song.name} - ${song.username}`;


    document.getElementById("status")
        .textContent =
        `session_id: ${sessionId}`;


    /*
     * not_songボタンの状態更新
     */
    updateNotSongButton();


    /*
     * 再生
     */
    audio.play()
        .catch(error => {

            console.error(
                "再生できませんでした:",
                error
            );
        });
}


/*
 * ========================================
 * 高評価
 * ========================================
 */

document.getElementById("like-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }


        liked = "like";


        document.getElementById("status")
            .textContent =
            "👍 高評価しました";
    });


/*
 * ========================================
 * 低評価
 * ========================================
 */

document.getElementById("dislike-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }


        liked = "dislike";


        document.getElementById("status")
            .textContent =
            "👎 低評価しました";
    });


/*
 * ========================================
 * Skip
 * ========================================
 */

document.getElementById("skip-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }


        /*
         * スキップとして記録
         */
        skipped = true;


        /*
         * finishPlayback()すると
         * currentSongがnullになるため、
         * 先に次の曲を取得する。
         */
        const nextSong =
            getNextSong();


        /*
         * 現在曲のログを保存
         */
        finishPlayback();


        /*
         * 次の曲を再生
         */
        if (nextSong !== null) {

            playSong(nextSong);
        }
    });


/*
 * ========================================
 * not_song
 * ========================================
 */

document.getElementById("not-song-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }


        const songId =
            currentSong.id;


        const index =
            notSongIds.indexOf(songId);


        /*
         * 現在は学習対象
         *
         * → 学習対象外にする
         */
        if (index === -1) {

            notSongIds.push(songId);


            document.getElementById("status")
                .textContent =
                "🚫 この曲を学習対象外にしました";


        /*
         * 現在は学習対象外
         *
         * → 学習対象に戻す
         */
        } else {

            notSongIds.splice(index, 1);


            document.getElementById("status")
                .textContent =
                "✅ この曲を学習対象に戻しました";
        }


        /*
         * localStorageへ保存
         */
        saveNotSongIds();


        /*
         * ボタン表示を更新
         */
        updateNotSongButton();
    });


/*
 * ========================================
 * 次の曲を取得
 * ========================================
 */

function getNextSong() {

    if (songs.length === 0) {

        return null;
    }


    /*
     * 現在曲がない場合
     */
    if (currentSong === null) {

        return songs[0];
    }


    const currentIndex =
        songs.findIndex(
            song => song.id === currentSong.id
        );


    /*
     * 現在曲が見つからない場合
     */
    if (currentIndex === -1) {

        return songs[0];
    }


    const nextIndex =
        (currentIndex + 1) % songs.length;


    return songs[nextIndex];
}


/*
 * ========================================
 * 次の曲を再生
 * ========================================
 */

function playNextSong() {

    const nextSong =
        getNextSong();


    if (nextSong === null) {

        return;
    }


    playSong(nextSong);
}


/*
 * ========================================
 * 再生終了
 * ========================================
 */

const audio =
    document.getElementById("audio");


audio.addEventListener("ended", () => {

    if (currentSong === null) {

        return;
    }


    /*
     * 次の曲を先に取得
     */
    const nextSong =
        getNextSong();


    /*
     * 最後まで再生したので
     * skipped = false
     */
    skipped = false;


    /*
     * 現在曲のログを保存
     */
    finishPlayback();


    /*
     * 次の曲を再生
     */
    if (nextSong !== null) {

        playSong(nextSong);
    }
});


/*
 * ========================================
 * 再生ログ確定
 * ========================================
 */

function finishPlayback() {

    if (
        currentSong === null ||
        playbackStartedAt === null
    ) {

        return;
    }


    /*
     * 実際に再生された秒数
     */
    const playedSeconds =
        Number(
            audio.currentTime.toFixed(3)
        );


    /*
     * 再生履歴
     */
    const historyEntry = {

        session_id:
            sessionId,

        song_id:
            currentSong.id,

        started_at:
            playbackStartedAt.toISOString(),

        played_seconds:
            playedSeconds,

        skipped:
            skipped,

        liked:
            liked,

        /*
         * 現在の曲が
         * 学習対象外かどうか
         */
        not_song:
            isNotSong(currentSong.id)
    };


    /*
     * localStorageへ保存
     */
    saveHistory(historyEntry);


    console.log(
        "再生ログ:",
        historyEntry
    );


    /*
     * 状態をリセット
     */
    currentSong = null;

    playbackStartedAt = null;

    liked = "none";

    skipped = false;
}


/*
 * ========================================
 * localStorage
 * ========================================
 */

function getHistory() {

    const data =
        localStorage.getItem(
            "play_history"
        );


    if (!data) {

        return [];
    }


    try {

        return JSON.parse(data);

    } catch (error) {

        console.error(error);

        return [];
    }
}


function saveHistory(entry) {

    const history =
        getHistory();


    history.push(entry);


    localStorage.setItem(
        "play_history",
        JSON.stringify(history)
    );


    updateHistoryCount();
}


/*
 * ========================================
 * JSONとして保存
 * ========================================
 */

document.getElementById("export-button")
    .addEventListener("click", () => {

        const history =
            getHistory();


        const json =
            JSON.stringify(
                history,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type: "application/json"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        a.href =
            url;


        a.download =
            "play_history.json";


        a.click();


        URL.revokeObjectURL(url);
    });


/*
 * ========================================
 * 履歴削除
 * ========================================
 */

document.getElementById("clear-button")
    .addEventListener("click", () => {

        if (!confirm(
            "ローカルに保存されている再生履歴を削除しますか？"
        )) {

            return;
        }


        localStorage.removeItem(
            "play_history"
        );


        updateHistoryCount();
    });


/*
 * ========================================
 * 件数表示
 * ========================================
 */

function updateHistoryCount() {

    const history =
        getHistory();


    document.getElementById("history-count")
        .textContent =
        history.length;
}


/*
 * ========================================
 * ページを閉じる場合
 * ========================================
 *
 * 再生中の曲についても
 * 可能な限りログを残す。
 */

window.addEventListener(
    "beforeunload",
    () => {

        if (currentSong !== null) {

            finishPlayback();
        }
    }
);


/*
 * ========================================
 * 初期化
 * ========================================
 */

updateHistoryCount();

updateNotSongButton();

loadSongs();

</script>

</body>
</html>
