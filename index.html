<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部室BGM</title>
<style>
  /* ============================================================
     見た目。動線が通ってから、時間が余ったら手を入れる
     ============================================================ */
  :root { --fg: #1a1a1a; --bg: #fff; --line: #d8dce2; --accent: #2b6cb0; }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--fg); background: var(--bg);
    margin: 0; padding: 24px; line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: #666; margin: 0 0 24px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  input, textarea, button { font: inherit; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; }
  button { padding: 8px 16px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { opacity: .85; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: #666; font-size: .9rem; }

  .field { margin-bottom: 8px; }
  .song-list { list-style: none; margin: 0; padding: 0; }
  .song-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .song-item:last-child { border-bottom: 0; }
  .song-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-item.is-playing .song-title { color: var(--accent); font-weight: bold; }
  .song-item.is-suggested { background: #fff7d6; }
  .btn-sub { background: #6b7280; }
  .btn-danger { background: #b91c1c; }
  iframe.player {
    width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 4px;
  }
</style>
</head>
<body>
<main>

  <h1>部室BGM</h1>
  <p class="lead">文化系サークルの部室でBGMを流すときに使う、候補から人が選んで再生するシンプルな音楽プレイヤー</p>

  <!-- ============================================================
       ここから下が本体。セクションを足したり消したりして作る
       ============================================================ -->

  <section>
    <h2>曲を追加（YouTube Music から選ぶ）</h2>
    <div class="field">
      <input id="title-input" type="text" placeholder="曲名（わかりやすい名前でOK）">
    </div>
    <div class="field">
      <input id="url-input" type="text" placeholder="YouTube Music の URL（例: https://music.youtube.com/watch?v=...）">
    </div>
    <div class="row">
      <button id="add">候補に追加</button>
      <button id="fetch-title" class="btn-sub">URL から曲名を取得</button>
    </div>
    <div id="fetch-message" class="muted"></div>
  </section>

  <section>
    <h2>候補一覧</h2>
    <ul id="song-list" class="song-list"></ul>
    <div id="empty-message" class="muted">まだ候補がありません</div>
    <div class="row" style="margin-top:12px;">
      <button id="pick-random" class="btn-sub">🎲 ランダムに1曲選ぶ</button>
    </div>
    <div id="random-message" class="muted"></div>
  </section>

  <!-- ============================================================
       AI に任せない部分：
       候補の中から実際に再生する1曲を選ぶのは、必ず人が「再生」ボタンを押す。
       🎲ランダムボタンは候補をハイライトするだけで、自動再生はしない。
       （低評価・スキップによる次の曲への切り替えのみ自動。曲は削除しない。チームで決定済み）
       ============================================================ -->

  <section>
    <h2>再生中</h2>
    <div id="player-area" class="muted">まだ再生していません</div>
    <div id="rating-area" class="row" style="margin-top:8px; display:none;">
      <button id="rate-up">👍 高評価</button>
      <button id="rate-down" class="btn-sub">👎 低評価</button>
      <button id="skip" class="btn-sub">⏭ スキップ</button>
    </div>
    <div id="rating-message" class="muted"></div>
  </section>

</main>

<script>
// ============================================================
// データの保存と読み込み（localStorage）
// この2つの関数だけ使えば、リロードしても消えません
// ============================================================

const STORAGE_KEY = 'app-data';

function loadData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return {
      songs: Array.isArray(data?.songs) ? data.songs : [],
      nowPlayingId: data?.nowPlayingId ?? null,
    };
  } catch {
    return { songs: [], nowPlayingId: null };   // 壊れた値が入っていても落ちないようにする
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============================================================
// YouTube の URL から動画IDを取り出す
// （music.youtube.com / www.youtube.com / youtu.be に対応）
// ============================================================

function extractVideoId(url) {
  try {
    const u = new URL(url);
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    if (u.hostname === 'youtu.be') return u.pathname.slice(1);
  } catch {
    // 不正なURLはそのまま無視する
  }
  return null;
}

// ============================================================
// YouTube の URL から曲名を取り出す（oEmbed）
//   ネットワークが使えるときだけ動く「おまけ」。
//   取得できなくても曲名は手で入力できるので、オフラインでも動線は止まらない
//   （取った曲名は入力欄に入れるだけ。そのまま使うか直すかは人が決める）
// ============================================================

async function fetchTitleFromUrl(url) {
  const videoId = extractVideoId(url);
  const target = videoId ? 'https://www.youtube.com/watch?v=' + videoId : url;
  const endpoint = 'https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(target);

  const res = await fetch(endpoint);
  if (!res.ok) throw new Error('oembed ' + res.status);
  const data = await res.json();
  if (!data.title) throw new Error('title がない');
  return data.title;
}

// ============================================================
// ここから下が処理。動線を1本だけ通す
//   ① 曲を追加する → ② 候補一覧に出る → ③ 人が選んで再生する
// ============================================================

const titleInput  = document.getElementById('title-input');
const urlInput    = document.getElementById('url-input');
const songList    = document.getElementById('song-list');
const emptyMessage = document.getElementById('empty-message');
const playerArea  = document.getElementById('player-area');
const ratingArea    = document.getElementById('rating-area');
const ratingMessage = document.getElementById('rating-message');
const randomMessage = document.getElementById('random-message');
const fetchTitleBtn = document.getElementById('fetch-title');
const fetchMessage  = document.getElementById('fetch-message');

// file:// で開いているか。YouTube は Referer の無いページからの埋め込み再生を拒否する（エラー153）
const IS_FILE_URL = location.protocol === 'file:';

// 「おすすめ」表示だけの候補ID。再生を始めるのは常に人が「再生」ボタンを押したとき
// （AI に任せない部分のルールを守るため、ここでは自動再生しない）
let suggestedId = null;

// ============================================================
// 埋め込みが使えないときの再生（別ウィンドウ）
//   エラー153（埋め込み禁止の曲／file:// で Referer が無い）はアプリ側では解除できないので、
//   YouTube Music のページを別ウィンドウで開いて再生する。
//   ただし勝手には開かない。人がリンクを押したときだけ開く。
//   ウィンドウに名前をつけておくと、次の曲のリンクを押したときに同じウィンドウが
//   使い回されるので、タブが増えず、前の曲の音も止まる
// ============================================================

const PLAYER_WINDOW_NAME = 'bushitsu-bgm-player';

// この曲をページ内の埋め込みプレイヤーで再生できるか
function canEmbed(song) {
  return Boolean(song.videoId) && !IS_FILE_URL;
}

function render() {
  const data = loadData();

  songList.innerHTML = '';
  emptyMessage.style.display = data.songs.length ? 'none' : '';

  data.songs.forEach((song) => {
    const li = document.createElement('li');
    let className = 'song-item';
    if (song.id === data.nowPlayingId) className += ' is-playing';
    if (song.id === suggestedId) className += ' is-suggested';
    li.className = className;

    const title = document.createElement('span');
    title.className = 'song-title';
    title.textContent = song.title;
    li.appendChild(title);

    const playBtn = document.createElement('button');
    playBtn.textContent = '再生';
    playBtn.addEventListener('click', () => {
      const d = loadData();
      d.nowPlayingId = song.id;
      saveData(d);
      suggestedId = null;
      render();
    });
    li.appendChild(playBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = '削除';
    deleteBtn.className = 'btn-danger';
    deleteBtn.addEventListener('click', () => {
      const d = loadData();
      d.songs = d.songs.filter((s) => s.id !== song.id);
      if (d.nowPlayingId === song.id) d.nowPlayingId = null;
      saveData(d);
      render();
    });
    li.appendChild(deleteBtn);

    songList.appendChild(li);
  });

  const nowPlaying = data.songs.find((s) => s.id === data.nowPlayingId);
  if (!nowPlaying) {
    playerArea.className = 'muted';
    playerArea.textContent = 'まだ再生していません';
  } else {
    playerArea.className = '';
    playerArea.innerHTML = '';

    // ファイルを直接開いている（file://）と YouTube に埋め込みを拒否されるので、
    // そのときは埋め込みプレイヤーを出さずにリンクだけにする
    if (canEmbed(nowPlaying)) {
      const iframe = document.createElement('iframe');
      iframe.className = 'player';
      iframe.src = 'https://www.youtube.com/embed/' + nowPlaying.videoId + '?autoplay=1';
      iframe.title = nowPlaying.title;
      iframe.allow = 'autoplay; encrypted-media';
      playerArea.appendChild(iframe);
    }

    // 埋め込みを権利者が禁止している曲もある（エラー153）。
    // どの場合でも再生できるように、YouTube で開くリンクは必ず出しておく
    const link = document.createElement('a');
    link.href = nowPlaying.url;
    link.target = PLAYER_WINDOW_NAME;   // 同じウィンドウを使い回す（タブが増えない）
    link.rel = 'noopener';
    link.textContent = '▶ 「' + nowPlaying.title + '」を YouTube Music で開く';
    playerArea.appendChild(link);

    const note = document.createElement('p');
    note.className = 'muted';
    note.style.margin = '4px 0 0';
    note.textContent = IS_FILE_URL
      ? 'ファイルを直接開いているため、ここでは埋め込み再生できません（YouTube のエラー153）。上のリンクを押すと、YouTube Music が別ウィンドウで開きます（押すまで開きません）'
      : '「エラー153」と出て再生できない曲は、埋め込みが禁止されています。上のリンクから YouTube Music で再生してください';
    playerArea.appendChild(note);
  }

  ratingArea.style.display = nowPlaying ? '' : 'none';
  ratingMessage.textContent = '';
}

// ============================================================
// 再生中の曲への評価・スキップ
//   👍 高評価: そのまま再生を続ける（候補には残す）
//   👎 低評価: 再生を止めて次の曲へ進む。曲は候補一覧に残したまま
//   ⏭ スキップ: 評価をつけずに次の曲へ進む。曲は候補一覧に残したまま
//   （最初にどの曲を再生するかは人がボタンを押して決める。
//    次の曲への切り替えだけ自動にする、とチームで決定済み）
// ============================================================

// いま再生している曲を除いた候補から、次に再生する1曲をランダムに選ぶ。
// 他に候補がなければ null（＝再生を停止する）
function pickNextSong(data) {
  const others = data.songs.filter((s) => s.id !== data.nowPlayingId);
  if (!others.length) return null;
  return others[Math.floor(Math.random() * others.length)];
}

// 次の曲へ進む。曲は削除しない
function goToNextSong(messageWhenNext, messageWhenEnd) {
  const data = loadData();
  if (!data.nowPlayingId) return;

  const next = pickNextSong(data);
  data.nowPlayingId = next ? next.id : null;
  suggestedId = null;
  saveData(data);
  render();
  ratingMessage.textContent = next ? messageWhenNext : messageWhenEnd;
}

document.getElementById('rate-up').addEventListener('click', () => {
  const data = loadData();
  if (!data.nowPlayingId) return;
  ratingMessage.textContent = '👍 高評価にしました。このまま再生を続けます';
});

document.getElementById('rate-down').addEventListener('click', () => {
  goToNextSong(
    '👎 低評価にしました。候補には残したまま、次の曲に切り替えました',
    '👎 低評価にしました。他に候補がないため停止しました（候補には残っています）'
  );
});

document.getElementById('skip').addEventListener('click', () => {
  goToNextSong(
    '⏭ スキップしました。次の曲に切り替えました',
    '⏭ スキップしました。他に候補がないため停止しました'
  );
});

document.getElementById('pick-random').addEventListener('click', () => {
  const data = loadData();
  if (!data.songs.length) {
    randomMessage.textContent = '候補がありません。先に曲を追加してください';
    return;
  }

  const picked = data.songs[Math.floor(Math.random() * data.songs.length)];
  suggestedId = picked.id;
  render();
  randomMessage.textContent = '🎲「' + picked.title + '」を選びました。再生するには「再生」ボタンを押してください';
});

fetchTitleBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  if (!url) {
    fetchMessage.textContent = '先に URL を貼ってください';
    return;
  }

  fetchTitleBtn.disabled = true;
  fetchMessage.textContent = '取得中…';
  try {
    titleInput.value = await fetchTitleFromUrl(url);
    fetchMessage.textContent = '曲名を取得しました。直したいときは書き換えてから追加してください';
  } catch {
    fetchMessage.textContent = '取得できませんでした（ネットワークが使えないか、URL が違うかもしれません）。曲名は手で入力してください';
  } finally {
    fetchTitleBtn.disabled = false;
  }
});

document.getElementById('add').addEventListener('click', () => {
  const title = titleInput.value.trim();
  const url = urlInput.value.trim();
  if (!title || !url) return;

  const data = loadData();
  data.songs.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2),
    title,
    url,
    videoId: extractVideoId(url),
  });
  saveData(data);

  titleInput.value = '';
  urlInput.value = '';
  render();
});

render();
</script>
</body>
</html>
