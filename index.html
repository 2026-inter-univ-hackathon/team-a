<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部室BGM</title>
<style>
  /* ============================================================
     見た目。動線が通ってから、時間が余ったら手を入れる
     ============================================================ */
  :root { --fg: #1a1a1a; --bg: #fff; --line: #d8dce2; --accent: #2b6cb0; }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--fg); background: var(--bg);
    margin: 0; padding: 24px; line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: #666; margin: 0 0 24px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  input, textarea, button { font: inherit; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; }
  button { padding: 8px 16px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { opacity: .85; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: #666; font-size: .9rem; }

  .field { margin-bottom: 8px; }
  .song-list { list-style: none; margin: 0; padding: 0; }
  .song-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .song-item:last-child { border-bottom: 0; }
  .song-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-item.is-playing .song-title { color: var(--accent); font-weight: bold; }
  .song-item.is-suggested { background: #fff7d6; }
  .btn-sub { background: #6b7280; }
  .btn-danger { background: #b91c1c; }
  iframe.player {
    width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 4px;
  }
</style>
</head>
<body>
<main>

  <h1>部室BGM</h1>
  <p class="lead">文化系サークルの部室でBGMを流すときに使う、候補から人が選んで再生するシンプルな音楽プレイヤー</p>

  <!-- ============================================================
       ここから下が本体。セクションを足したり消したりして作る
       ============================================================ -->

  <section>
    <h2>曲を追加（YouTube Music から選ぶ）</h2>
    <div class="field">
      <input id="title-input" type="text" placeholder="曲名（わかりやすい名前でOK）">
    </div>
    <div class="field">
      <input id="url-input" type="text" placeholder="YouTube Music の URL（例: https://music.youtube.com/watch?v=...）">
    </div>
    <div class="row">
      <button id="add">候補に追加</button>
    </div>
  </section>

  <section>
    <h2>候補一覧</h2>
    <ul id="song-list" class="song-list"></ul>
    <div id="empty-message" class="muted">まだ候補がありません</div>
    <div class="row" style="margin-top:12px;">
      <button id="pick-random" class="btn-sub">🎲 ランダムに1曲選ぶ</button>
    </div>
    <div id="random-message" class="muted"></div>
  </section>

  <!-- ============================================================
       AI に任せない部分：
       候補の中から実際に再生する1曲を選ぶのは、必ず人が「再生」ボタンを押す。
       🎲ランダムボタンは候補をハイライトするだけで、自動再生はしない。
       （低評価による削除・次の曲への切り替えのみ自動。チームで決定済み）
       ============================================================ -->

  <section>
    <h2>再生中</h2>
    <div id="player-area" class="muted">まだ再生していません</div>
    <div id="rating-area" class="row" style="margin-top:8px; display:none;">
      <button id="rate-up">👍 高評価</button>
      <button id="rate-down" class="btn-sub">👎 低評価</button>
    </div>
    <div id="rating-message" class="muted"></div>
  </section>

</main>

<script>
// ============================================================
// データの保存と読み込み（localStorage）
// この2つの関数だけ使えば、リロードしても消えません
// ============================================================

const STORAGE_KEY = 'app-data';

function loadData() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return {
      songs: Array.isArray(data?.songs) ? data.songs : [],
      nowPlayingId: data?.nowPlayingId ?? null,
    };
  } catch {
    return { songs: [], nowPlayingId: null };   // 壊れた値が入っていても落ちないようにする
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============================================================
// YouTube の URL から動画IDを取り出す
// （music.youtube.com / www.youtube.com / youtu.be に対応）
// ============================================================

function extractVideoId(url) {
  try {
    const u = new URL(url);
    if (u.searchParams.get('v')) return u.searchParams.get('v');
    if (u.hostname === 'youtu.be') return u.pathname.slice(1);
  } catch {
    // 不正なURLはそのまま無視する
  }
  return null;
}

// ============================================================
// ここから下が処理。動線を1本だけ通す
//   ① 曲を追加する → ② 候補一覧に出る → ③ 人が選んで再生する
// ============================================================

const titleInput  = document.getElementById('title-input');
const urlInput    = document.getElementById('url-input');
const songList    = document.getElementById('song-list');
const emptyMessage = document.getElementById('empty-message');
const playerArea  = document.getElementById('player-area');
const ratingArea    = document.getElementById('rating-area');
const ratingMessage = document.getElementById('rating-message');
const randomMessage = document.getElementById('random-message');

// 「おすすめ」表示だけの候補ID。再生を始めるのは常に人が「再生」ボタンを押したとき
// （AI に任せない部分のルールを守るため、ここでは自動再生しない）
let suggestedId = null;

function render() {
  const data = loadData();

  songList.innerHTML = '';
  emptyMessage.style.display = data.songs.length ? 'none' : '';

  data.songs.forEach((song) => {
    const li = document.createElement('li');
    let className = 'song-item';
    if (song.id === data.nowPlayingId) className += ' is-playing';
    if (song.id === suggestedId) className += ' is-suggested';
    li.className = className;

    const title = document.createElement('span');
    title.className = 'song-title';
    title.textContent = song.title;
    li.appendChild(title);

    const playBtn = document.createElement('button');
    playBtn.textContent = '再生';
    playBtn.addEventListener('click', () => {
      const d = loadData();
      d.nowPlayingId = song.id;
      saveData(d);
      suggestedId = null;
      render();
    });
    li.appendChild(playBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = '削除';
    deleteBtn.className = 'btn-danger';
    deleteBtn.addEventListener('click', () => {
      const d = loadData();
      d.songs = d.songs.filter((s) => s.id !== song.id);
      if (d.nowPlayingId === song.id) d.nowPlayingId = null;
      saveData(d);
      render();
    });
    li.appendChild(deleteBtn);

    songList.appendChild(li);
  });

  const nowPlaying = data.songs.find((s) => s.id === data.nowPlayingId);
  if (!nowPlaying) {
    playerArea.className = 'muted';
    playerArea.textContent = 'まだ再生していません';
  } else if (nowPlaying.videoId) {
    playerArea.className = '';
    playerArea.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.className = 'player';
    iframe.src = 'https://www.youtube.com/embed/' + nowPlaying.videoId + '?autoplay=1';
    iframe.title = nowPlaying.title;
    iframe.allow = 'autoplay; encrypted-media';
    playerArea.appendChild(iframe);
  } else {
    playerArea.className = '';
    playerArea.innerHTML = '';
    const link = document.createElement('a');
    link.href = nowPlaying.url;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = nowPlaying.title + ' を YouTube Music で開く';
    playerArea.appendChild(link);
  }

  ratingArea.style.display = nowPlaying ? '' : 'none';
  ratingMessage.textContent = '';
}

// ============================================================
// 再生中の曲への評価
//   👍 高評価: そのまま再生を続ける（候補には残す）
//   👎 低評価: 候補一覧から削除し、残りの候補からランダムに次の曲を自動再生する
//   （最初にどの曲を再生するかは人がボタンを押して決める。
//    低評価による削除・切り替えのみ自動にする、とチームで決定済み）
// ============================================================

document.getElementById('rate-up').addEventListener('click', () => {
  const data = loadData();
  if (!data.nowPlayingId) return;
  ratingMessage.textContent = '👍 高評価にしました。このまま再生を続けます';
});

document.getElementById('rate-down').addEventListener('click', () => {
  const data = loadData();
  const currentIndex = data.songs.findIndex((s) => s.id === data.nowPlayingId);
  if (currentIndex === -1) return;

  data.songs.splice(currentIndex, 1);

  const next = data.songs.length
    ? data.songs[Math.floor(Math.random() * data.songs.length)]
    : null;

  data.nowPlayingId = next ? next.id : null;
  suggestedId = null;
  saveData(data);
  render();
  ratingMessage.textContent = next
    ? '👎 低評価にしました。候補から削除し、次の曲を再生します'
    : '👎 低評価にしました。候補から削除しました。他に候補がないため停止しました';
});

document.getElementById('pick-random').addEventListener('click', () => {
  const data = loadData();
  if (!data.songs.length) {
    randomMessage.textContent = '候補がありません。先に曲を追加してください';
    return;
  }

  const picked = data.songs[Math.floor(Math.random() * data.songs.length)];
  suggestedId = picked.id;
  render();
  randomMessage.textContent = '🎲「' + picked.title + '」を選びました。再生するには「再生」ボタンを押してください';
});

document.getElementById('add').addEventListener('click', () => {
  const title = titleInput.value.trim();
  const url = urlInput.value.trim();
  if (!title || !url) return;

  const data = loadData();
  data.songs.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2),
    title,
    url,
    videoId: extractVideoId(url),
  });
  saveData(data);

  titleInput.value = '';
  urlInput.value = '';
  render();
});

render();
</script>
</body>
</html>
