<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロダクト名</title>
<style>
  /* ============================================================
     見た目。動線が通ってから、時間が余ったら手を入れる
     ============================================================ */
  :root { --fg: #1a1a1a; --bg: #fff; --line: #d8dce2; --accent: #2b6cb0; }
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color: var(--fg); background: var(--bg);
    margin: 0; padding: 24px; line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: #666; margin: 0 0 24px; }
  section { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  input, textarea, button { font: inherit; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 4px; }
  button { padding: 8px 16px; border: 0; border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { opacity: .85; }
  .row { display: flex; gap: 8px; align-items: center; }
  .muted { color: #666; font-size: .9rem; }
</style>
</head>
<body>
<main>

  <h1>プロダクト名</h1>
  <p class="lead">一言で何か（誰の、何を解決するか）</p>

  <!-- ============================================================
       ここから下が本体。セクションを足したり消したりして作る
       ============================================================ -->

  <section>
    <h2>入力</h2>
    <div class="row">
      <input id="input" type="text" placeholder="ここに入力">
      <button id="save">保存</button>
    </div>
  </section>

  <section>
    <h2>結果</h2>
    <div id="output" class="muted">まだ何もありません</div>
  </section>

  <!-- ============================================================
       AI に任せない部分は、ここに置くことが多いです。
       AI が候補を出して、最後に人が選ぶ／決める場所を1つ残してください。
       （例）候補を3つ並べて、人がボタンで選ぶ
       ============================================================ -->

</main>

<script>
// ============================================================
// データの保存と読み込み（localStorage）
// この2つの関数だけ使えば、リロードしても消えません
// ============================================================

const STORAGE_KEY = 'app-data';

function loadData() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {};
  } catch {
    return {};   // 壊れた値が入っていても落ちないようにする
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============================================================
// ここから下が処理。動線を1本だけ通す
//   ① 人が入力すること → ② 画面で起きること → ③ 人が目にする結果
// この3つが繋がったら、9/4 は合格です。枝分かれは作らないでください。
// ============================================================

const input  = document.getElementById('input');
const output = document.getElementById('output');

function render() {
  const data = loadData();
  output.textContent = data.text ? data.text : 'まだ何もありません';
  output.className = data.text ? '' : 'muted';
}

document.getElementById('save').addEventListener('click', () => {
  const data = loadData();
  data.text = input.value;
  saveData(data);
  input.value = '';
  render();
});

render();
</script>
</body>
</html>
