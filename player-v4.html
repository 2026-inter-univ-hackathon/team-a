<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部室BGM</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
        }

        #now-playing {
            margin: 20px 0;
        }

        /*
         * 曲一覧を四角い枠の中でスクロール
         */
        #song-list {
            height: 300px;
            overflow-y: auto;

            border: 1px solid #aaa;
            border-radius: 6px;

            padding: 5px;
        }

        .song {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .song:last-child {
            border-bottom: none;
        }

        .song:hover {
            background: #f5f5f5;
        }

        #status {
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>

<body>

<h1>部室BGM</h1>

<p>
    再生ボタンを押すだけで、部室のBGMを流すシンプルな音楽プレイヤー
</p>

<section>
    <h2>再生中</h2>

    <div id="now-playing">
        まだ再生していません
    </div>

    <audio id="audio" controls></audio>

    <div>
        <button id="like-button">👍 高評価</button>
        <button id="dislike-button">👎 低評価</button>
        <button id="skip-button">⏭ スキップ</button>
    </div>

    <div id="status"></div>
</section>

<section>
    <h2>曲一覧</h2>

    <div id="song-list">
        曲を読み込んでいます…
    </div>
</section>

<section>
    <h2>再生履歴</h2>

    <button id="export-button">
        play_history.json を保存
    </button>

    <button id="clear-button">
        ローカル履歴を削除
    </button>

    <p>
        保存件数: <span id="history-count">0</span>
    </p>
</section>


<script>
"use strict";


/*
 * ========================================
 * データ
 * ========================================
 */

let songs = [];
let currentSong = null;

let playbackStartedAt = null;
let liked = "none";
let skipped = false;


/*
 * 1ページ = 1セッション
 */
const sessionId = createSessionId();


/*
 * ========================================
 * session_id
 * ========================================
 */

function createSessionId() {

    const now = new Date();

    const timestamp =
        now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, "0") +
        String(now.getDate()).padStart(2, "0") +
        "-" +
        String(now.getHours()).padStart(2, "0") +
        String(now.getMinutes()).padStart(2, "0") +
        String(now.getSeconds()).padStart(2, "0");

    const random =
        crypto.randomUUID
            ? crypto.randomUUID().split("-")[0]
            : Math.random().toString(16).slice(2, 10);

    return `${timestamp}-${random}`;
}


/*
 * ========================================
 * songs.json 読み込み
 * ========================================
 */

async function loadSongs() {

    try {

        const response = await fetch("songs.json");

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        songs = await response.json();

        renderSongList();

    } catch (error) {

        console.error(error);

        document.getElementById("song-list").textContent =
            "曲の読み込みに失敗しました。";
    }
}


/*
 * ========================================
 * 曲一覧
 * ========================================
 */

function renderSongList() {

    const list = document.getElementById("song-list");

    list.innerHTML = "";

    for (const song of songs) {

        const element = document.createElement("div");

        element.className = "song";

        element.textContent =
            `${song.name} - ${song.username}`;

        element.addEventListener("click", () => {
            playSong(song);
        });

        list.appendChild(element);
    }
}


/*
 * ========================================
 * 曲再生
 * ========================================
 */

function playSong(song) {

    /*
     * すでに別の曲が再生中なら、
     * その曲のログだけ確定する。
     *
     * currentSong 自体は次の曲に置き換える。
     */
    if (currentSong !== null) {
        finishPlayback();
    }

    currentSong = song;

    liked = "none";
    skipped = false;

    playbackStartedAt = new Date();

    const audio = document.getElementById("audio");

    /*
     * 一度停止してから src を変更
     */
    audio.pause();

    audio.src = song.preview_url;

    /*
     * 再生位置を先頭に戻す
     */
    audio.currentTime = 0;

    document.getElementById("now-playing").textContent =
        `${song.name} - ${song.username}`;

    document.getElementById("status").textContent =
        `session_id: ${sessionId}`;

    audio.play().catch(error => {
        console.error("再生できませんでした:", error);
    });
}


/*
 * ========================================
 * Like
 * ========================================
 */

document.getElementById("like-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }

        liked = "like";

        document.getElementById("status").textContent =
            "👍 高評価しました";
    });


/*
 * ========================================
 * Dislike
 * ========================================
 */

document.getElementById("dislike-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }

        liked = "dislike";

        document.getElementById("status").textContent =
            "👎 低評価しました";
    });


/*
 * ========================================
 * Skip
 * ========================================
 */

document.getElementById("skip-button")
    .addEventListener("click", () => {

        if (currentSong === null) {
            return;
        }

        /*
         * 今の曲をスキップとして記録
         */
        skipped = true;

        /*
         * 次の曲を先に決定する
         *
         * finishPlayback() で currentSong が
         * null になってしまうため、
         * ここで次の曲を保存しておく。
         */
        const nextSong = getNextSong();

        /*
         * 現在曲のログを保存
         */
        finishPlayback();

        /*
         * 次の曲を再生
         */
        if (nextSong !== null) {
            playSong(nextSong);
        }
    });


/*
 * ========================================
 * 次の曲を取得
 * ========================================
 */

function getNextSong() {

    if (songs.length === 0) {
        return null;
    }

    if (currentSong === null) {
        return songs[0];
    }

    const currentIndex =
        songs.findIndex(song => song.id === currentSong.id);

    /*
     * 現在曲が見つからない場合
     */
    if (currentIndex === -1) {
        return songs[0];
    }

    const nextIndex =
        (currentIndex + 1) % songs.length;

    return songs[nextIndex];
}


/*
 * ========================================
 * 次の曲を再生
 * ========================================
 */

function playNextSong() {

    const nextSong = getNextSong();

    if (nextSong === null) {
        return;
    }

    playSong(nextSong);
}


/*
 * ========================================
 * 再生終了
 * ========================================
 */

const audio = document.getElementById("audio");

audio.addEventListener("ended", () => {

    if (currentSong === null) {
        return;
    }

    /*
     * 曲終了時点の次の曲を先に取得
     */
    const nextSong = getNextSong();

    /*
     * 最後まで聴いたので skipped は false
     */
    skipped = false;

    /*
     * 現在曲のログを保存
     */
    finishPlayback();

    /*
     * 次の曲を再生
     */
    if (nextSong !== null) {
        playSong(nextSong);
    }
});


/*
 * ========================================
 * 再生ログ確定
 * ========================================
 */

function finishPlayback() {

    if (
        currentSong === null ||
        playbackStartedAt === null
    ) {
        return;
    }

    const playedSeconds =
        Number(audio.currentTime.toFixed(3));

    const historyEntry = {

        session_id: sessionId,

        song_id: currentSong.id,

        started_at:
            playbackStartedAt.toISOString(),

        played_seconds:
            playedSeconds,

        skipped:
            skipped,

        liked:
            liked
    };

    saveHistory(historyEntry);

    console.log("再生ログ:", historyEntry);

    /*
     * ここで現在曲を終了させる
     */
    currentSong = null;

    playbackStartedAt = null;

    liked = "none";

    skipped = false;
}


/*
 * ========================================
 * localStorage
 * ========================================
 */

function getHistory() {

    const data =
        localStorage.getItem("play_history");

    if (!data) {
        return [];
    }

    try {
        return JSON.parse(data);

    } catch (error) {

        console.error(error);

        return [];
    }
}


function saveHistory(entry) {

    const history = getHistory();

    history.push(entry);

    localStorage.setItem(
        "play_history",
        JSON.stringify(history)
    );

    updateHistoryCount();
}


/*
 * ========================================
 * JSON保存
 * ========================================
 */

document.getElementById("export-button")
    .addEventListener("click", () => {

        const history = getHistory();

        const json =
            JSON.stringify(history, null, 2);

        const blob = new Blob(
            [json],
            {
                type: "application/json"
            }
        );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;

        a.download = "play_history.json";

        a.click();

        URL.revokeObjectURL(url);
    });


/*
 * ========================================
 * 履歴削除
 * ========================================
 */

document.getElementById("clear-button")
    .addEventListener("click", () => {

        if (!confirm(
            "ローカルに保存されている再生履歴を削除しますか？"
        )) {
            return;
        }

        localStorage.removeItem("play_history");

        updateHistoryCount();
    });


/*
 * ========================================
 * 件数表示
 * ========================================
 */

function updateHistoryCount() {

    const history = getHistory();

    document.getElementById("history-count")
        .textContent = history.length;
}


/*
 * ========================================
 * ページを閉じる
 * ========================================
 */

window.addEventListener("beforeunload", () => {

    if (currentSong !== null) {
        finishPlayback();
    }
});


/*
 * ========================================
 * 初期化
 * ========================================
 */

updateHistoryCount();

loadSongs();

</script>

</body>
</html>
